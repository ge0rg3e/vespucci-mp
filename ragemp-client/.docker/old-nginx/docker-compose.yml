version: '3.6'
services:
  client-interface:
    image: nginx:1.16-alpine
    container_name: client-interface
    volumes:
      - ./public_html:/usr/share/nginx/html
      - ./data/nginx/default.conf:/etc/nginx/conf.d/default.conf
      # CERTBOT REQUIRED
      - /home/shared/containers/nginx/data/certbot/conf:/etc/letsencrypt
    ports:
      - "5049:80"
      - "5050:443"
    networks:
      - my-proxy-net

networks:
  my-proxy-net:
    external:
      name: proxynet
